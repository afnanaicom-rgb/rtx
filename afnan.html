<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afnan AI - Ultimate Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;600&display=swap');
        
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --sidebar-glass: rgba(15, 15, 15, 0.6);
            --input-bg: rgba(20, 20, 22, 0.7);
            --glass-header: rgba(255, 255, 255, 0.02);
        }

        .light-mode {
            --bg-color: #f8f9fa;
            --text-color: #1a1a1a;
            --glass-bg: rgba(0, 0, 0, 0.03);
            --sidebar-glass: rgba(255, 255, 255, 0.6);
            --input-bg: rgba(240, 240, 243, 0.8);
            --glass-header: rgba(0, 0, 0, 0.02);
        }

        body {
            font-family: 'Noto Sans Arabic', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Glassmorphism Effects */
        .glass-base {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(128, 128, 128, 0.1);
        }

        .glass-header {
            background: var(--glass-header);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(128, 128, 128, 0.05);
        }

        .sidebar-panel {
            background: var(--sidebar-glass);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-left: 1px solid rgba(128, 128, 128, 0.1);
            z-index: 250;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-bar {
            background: var(--input-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(128, 128, 128, 0.1);
        }

        /* Message Styling */
        .message-container {
            padding: 1rem 0;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .message-user {
            align-self: flex-start;
            text-align: left;
            color: var(--text-color);
            max-width: 80%;
            animation: fadeIn 0.4s ease-in;
        }

        .message-ai {
            align-self: flex-end;
            text-align: right;
            color: var(--text-color);
            max-width: 80%;
            animation: fadeIn 0.4s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Square Images */
        .home-image-card {
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            border: 1px solid rgba(128, 128, 128, 0.1);
        }

        .home-image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Image Overlay */
        #imageOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        #imageOverlay img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 12px;
        }

        .close-overlay {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 50%;
        }

        /* Mode Icon Badge */
        .mode-badge {
            display: none;
            align-items: center;
            gap: 4px;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 10px;
            color: #3b82f6;
            position: relative;
            cursor: pointer;
            user-select: none;
        }

        .mode-badge .delete-x {
            font-size: 12px;
            font-weight: bold;
            color: #ef4444;
            margin-right: 4px;
        }

        /* Options Popup */
        #optionsMenu {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 0;
            margin-bottom: 1rem;
            width: 200px;
            background: var(--sidebar-glass);
            backdrop-filter: blur(25px);
            border-radius: 24px;
            padding: 8px;
            border: 1px solid rgba(128, 128, 128, 0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            z-index: 300;
        }

        .option-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-radius: 16px;
            transition: background 0.2s;
            cursor: pointer;
            font-size: 14px;
        }
        .option-item:hover { background: rgba(255, 255, 255, 0.05); }

        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* Login Page Styling */
        #loginPage {
            position: fixed;
            inset: 0;
            background: #000000;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px;
            text-align: center;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 40px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            margin-bottom: 12px;
            font-weight: 600;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
        }

        .google-btn { background: #ffffff; color: #000000; }
        .github-btn { background: #24292e; color: #ffffff; }
        .x-btn { background: #000000; color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.2); }

        #mainApp { display: none; }

        /* User Profile in Sidebar */
        .user-profile-section {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid rgba(128, 128, 128, 0.1);
        }

        .user-info-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            margin-bottom: 12px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(59, 130, 246, 0.5);
        }

        /* Toast Notification */
        #toastContainer {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: slideDown 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            pointer-events: auto;
            min-width: 300px;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .toast.error { border-left: 4px solid #ef4444; }
        .toast.success { border-left: 4px solid #10b981; border-color: rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Toast Container -->
    <div id="toastContainer"></div>

    <!-- Login Page -->
    <div id="loginPage">
        <div class="mt-10">
            <img src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663174655187/mcieZCLEOIrmCjBq.png" alt="Afnan AI Logo" class="w-24 h-24 mx-auto mb-6 object-contain">
        </div>

        <div class="flex-1 flex flex-col justify-center">
            <h1 class="text-4xl font-bold mb-2">Welcome to Afnan AI</h1>
            <p class="text-gray-400 mb-12">ابدأ رحلتك الإبداعية الآن</p>
        </div>

        <div class="login-card">
            <p class="text-sm text-gray-400 mb-6 font-semibold">Login to Google</p>
            
            <button onclick="loginWithGoogle()" class="social-btn google-btn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5" alt="Google">
                <span>Google Log in</span>
            </button>

            <button onclick="loginWithGithub()" class="social-btn github-btn">
                <i data-lucide="github" class="w-5 h-5"></i>
                <span>GitHub Login</span>
            </button>

            <button onclick="loginWithX()" class="social-btn x-btn">
                <i data-lucide="twitter" class="w-5 h-5"></i>
                <span>Login with X</span>
            </button>
        </div>
    </div>

    <!-- Main App Content -->
    <div id="mainApp" class="flex flex-col h-full">
        <div id="imageOverlay" onclick="closeOverlay()">
            <div class="close-overlay"><i data-lucide="x" class="w-6 h-6"></i></div>
            <img id="overlayImg" src="" alt="Full size">
        </div>

        <input type="file" id="filePicker" accept="image/*" multiple class="hidden" onchange="previewImages(event)">

        <!-- Top Header -->
        <header class="fixed top-0 w-full z-[150] px-6 py-4 flex justify-between items-center glass-header">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="w-10 h-10 flex items-center justify-center glass-base rounded-full hover:bg-white/10 transition">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                <div class="flex items-center gap-2">
                    <img src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663174655187/mcieZCLEOIrmCjBq.png" alt="Afnan AI Logo" class="w-8 h-8 object-contain">
                    <span class="font-bold text-xl tracking-tight">Afnan AI</span>
                </div>
            </div>
            <button onclick="location.reload()" class="w-10 h-10 flex items-center justify-center glass-base rounded-full text-blue-500 hover:bg-blue-500/10 transition">
                <i data-lucide="refresh-cw" class="w-5 h-5"></i>
            </button>
        </header>

        <!-- Sidebar -->
        <aside id="sidebar" class="fixed top-0 right-0 h-full w-80 sidebar-panel translate-x-full flex flex-col p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-8 mt-2">
                <h2 class="font-bold text-lg">الإعدادات</h2>
                <button onclick="toggleSidebar()" class="text-gray-500 hover:text-red-400"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            
            <div class="flex-1 overflow-y-auto no-scrollbar space-y-6">
                <div class="p-4 bg-white/5 rounded-3xl border border-white/5">
                    <p class="text-xs text-gray-500 mb-3 font-bold uppercase tracking-widest">المظهر</p>
                    <div class="flex items-center justify-between">
                        <span id="modeText" class="text-sm">الوضع الداكن</span>
                        <button onclick="toggleTheme()" class="w-12 h-6 rounded-full bg-blue-600 relative transition-all duration-300">
                            <div id="themeCircle" class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-all duration-300"></div>
                        </button>
                    </div>
                </div>

                <div class="space-y-3">
                    <p class="text-xs text-gray-500 font-bold uppercase tracking-widest px-2">المحادثات</p>
                    <div class="p-4 bg-white/5 rounded-2xl border border-white/5 hover:bg-white/10 cursor-pointer transition">
                        <p class="text-xs truncate">أرشيف المحادثات</p>
                    </div>
                </div>
            </div>

            <!-- User Profile Section at Bottom -->
            <div class="user-profile-section">
                <div class="user-info-card">
                    <img id="userAvatar" src="https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp&f=y" class="user-avatar" alt="User">
                    <div class="flex-1 overflow-hidden">
                        <p id="userName" class="text-sm font-bold truncate">جاري التحميل...</p>
                        <p id="userEmail" class="text-[10px] text-gray-500 truncate">user@example.com</p>
                    </div>
                </div>
                <button onclick="logout()" class="w-full flex items-center justify-center gap-2 p-3 rounded-xl bg-red-500/10 text-red-500 hover:bg-red-500/20 transition font-semibold text-sm">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                    <span>تسجيل الخروج</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main id="mainContent" class="flex-1 overflow-y-auto pt-24 pb-44 px-4 no-scrollbar">
            <div id="chatView" class="flex flex-col max-w-3xl mx-auto">
                <div id="homeContent" class="space-y-8 mt-10">
                    <div class="text-center mb-12">
                        <img src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663174655187/mcieZCLEOIrmCjBq.png" alt="Afnan AI Logo" class="w-24 h-24 mx-auto mb-6 object-contain">
                        <h1 class="text-4xl font-bold mb-3">مرحباً بك في Afnan AI</h1>
                        <p class="text-gray-500">مساعدك الذكي للإبداع والإنتاجية</p>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                        <div class="home-image-card" onclick="openOverlay('https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&q=80&w=800')">
                            <img src="https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&q=80&w=800" alt="AI 1">
                        </div>
                        <div class="home-image-card" onclick="openOverlay('https://images.unsplash.com/photo-1614741118887-7a4ee193a5fa?auto=format&fit=crop&q=80&w=800')">
                            <img src="https://images.unsplash.com/photo-1614741118887-7a4ee193a5fa?auto=format&fit=crop&q=80&w=800" alt="AI 2">
                        </div>
                        <div class="home-image-card" onclick="openOverlay('https://images.unsplash.com/photo-1620712943543-bcc4688e7485?auto=format&fit=crop&q=80&w=800')">
                            <img src="https://images.unsplash.com/photo-1620712943543-bcc4688e7485?auto=format&fit=crop&q=80&w=800" alt="AI 3">
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Bottom UI -->
        <div class="fixed bottom-8 left-0 w-full px-6 z-[200]">
            <div class="max-w-2xl mx-auto relative">
                
                <!-- Options Menu -->
                <div id="optionsMenu">
                    <div class="option-item" onclick="setMode('صورة', 'image')">
                        <span>توليد صور</span><i data-lucide="image" class="w-4 h-4 text-blue-400"></i>
                    </div>
                    <div class="option-item" onclick="setMode('صوت', 'mic')">
                        <span>توليد صوت</span><i data-lucide="mic" class="w-4 h-4 text-teal-400"></i>
                    </div>
                    <div class="h-[1px] bg-white/5 mx-2 my-1"></div>
                    <div class="option-item" onclick="triggerFilePicker()">
                        <span>المعرض</span><i data-lucide="layout-grid" class="w-4 h-4 text-gray-400"></i>
                    </div>
                </div>

                <div class="input-bar flex flex-col rounded-[32px] overflow-hidden shadow-2xl">
                    <div id="previewContainer" class="flex gap-2 px-4 pt-3 overflow-x-auto no-scrollbar hidden"></div>
                    <div class="flex items-end gap-2 px-3 py-2">
                        <div class="flex items-center gap-1 mb-2">
                            <button onclick="toggleOptions(event)" class="p-3 text-gray-500 hover:text-blue-500 transition">
                                <i data-lucide="paperclip" class="w-6 h-6 rotate-45"></i>
                            </button>
                            <!-- Mode Badge -->
                            <div id="modeBadge" class="mode-badge">
                                <span class="delete-x">X</span>
                                <i id="modeIcon" data-lucide="zap" class="w-3 h-3"></i>
                                <span id="modeName">وضع</span>
                            </div>
                        </div>
                        
                        <textarea id="mainInput" rows="1" placeholder="اسأل Afnan AI..." 
                            class="bg-transparent flex-1 outline-none text-[15px] py-3 text-right placeholder-gray-500 resize-none"></textarea>
                        
                        <button id="sendBtn" onclick="handleSend()" class="p-3 rounded-full bg-white/5 transition-all">
                            <i data-lucide="arrow-up" id="sendIcon" class="w-6 h-6 text-gray-400"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, GithubAuthProvider, TwitterAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBnmqWRY6lV54meFvO89QeXwtd28w81FcY",
            authDomain: "rtx3090-28439.firebaseapp.com",
            databaseURL: "https://rtx3090-28439-default-rtdb.firebaseio.com",
            projectId: "rtx3090-28439",
            storageBucket: "rtx3090-28439.firebasestorage.app",
            messagingSenderId: "178612030690",
            appId: "1:178612030690:web:883189ced2ed3a78e3e2bb"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Toast Helper
        window.showToast = (message, type = 'error') => {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'error' ? 'alert-circle' : 'check-circle';
            toast.innerHTML = `
                <i data-lucide="${icon}" class="w-5 h-5 ${type === 'error' ? 'text-red-500' : 'text-green-500'}"></i>
                <span class="text-sm font-medium">${message}</span>
            `;
            container.appendChild(toast);
            lucide.createIcons();
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-20px)';
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        };

        // Auth Functions
        window.loginWithGoogle = () => {
            const provider = new GoogleAuthProvider();
            signInWithPopup(auth, provider).catch(err => showToast(err.message));
        };

        window.loginWithGithub = () => {
            const provider = new GithubAuthProvider();
            signInWithPopup(auth, provider).catch(err => showToast(err.message));
        };

        window.loginWithX = () => {
            const provider = new TwitterAuthProvider();
            signInWithPopup(auth, provider).catch(err => showToast(err.message));
        };

        window.logout = () => {
            signOut(auth).then(() => {
                document.getElementById('mainApp').style.display = 'none';
                document.getElementById('loginPage').style.display = 'flex';
                showToast("تم تسجيل الخروج بنجاح", "success");
            }).catch(err => showToast(err.message));
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('mainApp').style.display = 'flex';
                
                // Update Sidebar Profile
                document.getElementById('userName').innerText = user.displayName || "مستخدم Afnan AI";
                document.getElementById('userEmail').innerText = user.email || user.providerData[0]?.email || "لا يوجد بريد إلكتروني";
                if (user.photoURL) {
                    document.getElementById('userAvatar').src = user.photoURL;
                }
                
                showToast(`مرحباً بك، ${user.displayName || 'مستخدمنا العزيز'}`, "success");
            } else {
                document.getElementById('mainApp').style.display = 'none';
                document.getElementById('loginPage').style.display = 'flex';
            }
        });
    </script>

    <script>
        lucide.createIcons();
        const mainInput = document.getElementById('mainInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatView = document.getElementById('chatView');
        const homeContent = document.getElementById('homeContent');
        const optionsMenu = document.getElementById('optionsMenu');
        const modeBadge = document.getElementById('modeBadge');
        const modeName = document.getElementById('modeName');
        const modeIcon = document.getElementById('modeIcon');
        const previewContainer = document.getElementById('previewContainer');

        let currentMode = null;
        let pressTimer;
        let selectedFiles = [];

        mainInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight > 150 ? 150 : this.scrollHeight) + 'px';
            const hasContent = this.value.trim().length > 0 || selectedFiles.length > 0;
            sendBtn.style.background = hasContent ? 'white' : 'rgba(255,255,255,0.05)';
            document.getElementById('sendIcon').style.color = hasContent ? 'black' : '#9ca3af';
        });

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            document.getElementById('themeCircle').style.transform = isLight ? 'translateX(24px)' : 'translateX(0)';
            document.getElementById('modeText').innerText = isLight ? 'الوضع الفاتح' : 'الوضع الداكن';
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('translate-x-full');
        }

        function toggleOptions(e) {
            e.stopPropagation();
            optionsMenu.style.display = optionsMenu.style.display === 'block' ? 'none' : 'block';
        }

        function setMode(name, icon) {
            currentMode = name;
            modeName.innerText = name;
            modeIcon.setAttribute('data-lucide', icon);
            modeBadge.style.display = 'flex';
            optionsMenu.style.display = 'none';
            lucide.createIcons();
        }

        function triggerFilePicker() {
            document.getElementById('filePicker').click();
            optionsMenu.style.display = 'none';
        }

        function previewImages(event) {
            const files = event.target.files;
            if (files.length > 0) {
                setMode('المعرض', 'layout-grid');
                previewContainer.innerHTML = '';
                previewContainer.classList.remove('hidden');
                selectedFiles = Array.from(files);

                selectedFiles.forEach((file, index) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const div = document.createElement('div');
                        div.className = "relative w-16 h-16 flex-shrink-0";
                        div.innerHTML = `
                            <img src="${e.target.result}" class="w-full h-full object-cover rounded-lg border border-white/10">
                            <button onclick="removeFile(${index})" class="absolute -top-1 -right-1 bg-red-500 text-white rounded-full p-0.5">
                                <i data-lucide="x" class="w-3 h-3"></i>
                            </button>
                        `;
                        previewContainer.appendChild(div);
                        lucide.createIcons();
                    };
                    reader.readAsDataURL(file);
                });
                
                sendBtn.style.background = 'white';
                document.getElementById('sendIcon').style.color = 'black';
            }
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            if (selectedFiles.length === 0) {
                previewContainer.classList.add('hidden');
                if (currentMode === 'المعرض') resetChat();
            } else {
                const dt = new DataTransfer();
                selectedFiles.forEach(f => dt.items.add(f));
                document.getElementById('filePicker').files = dt.files;
                previewImages({target: {files: dt.files}});
            }
        }

        modeBadge.addEventListener('mousedown', startPress);
        modeBadge.addEventListener('touchstart', startPress);
        modeBadge.addEventListener('mouseup', endPress);
        modeBadge.addEventListener('touchend', endPress);

        function startPress() {
            pressTimer = window.setTimeout(() => {
                resetChat();
            }, 1000);
        }

        function endPress() {
            clearTimeout(pressTimer);
        }

        function resetChat() {
            currentMode = null;
            modeBadge.style.display = 'none';
            selectedFiles = [];
            previewContainer.innerHTML = '';
            previewContainer.classList.add('hidden');
            chatView.innerHTML = '';
            if (homeContent) homeContent.style.display = 'block';
        }

        function openOverlay(src) {
            document.getElementById('overlayImg').src = src;
            document.getElementById('imageOverlay').style.display = 'flex';
        }

        function closeOverlay() {
            document.getElementById('imageOverlay').style.display = 'none';
        }

        function handleSend() {
            const text = mainInput.value.trim();
            if (!text && selectedFiles.length === 0) return;
            
            if (homeContent) homeContent.style.display = 'none';
            
            let messageHtml = `<p class="text-[16px] leading-relaxed">${text}</p>`;
            if (selectedFiles.length > 0) {
                messageHtml += `<div class="grid grid-cols-2 gap-2 mt-3">`;
                selectedFiles.forEach(file => {
                    const url = URL.createObjectURL(file);
                    messageHtml += `<img src="${url}" class="rounded-xl w-full aspect-square object-cover border border-white/10 cursor-pointer" onclick="openOverlay('${url}')">`;
                });
                messageHtml += `</div>`;
            }

            createMessage(messageHtml, 'user', true);
            
            mainInput.value = '';
            mainInput.style.height = 'auto';
            selectedFiles = [];
            previewContainer.innerHTML = '';
            previewContainer.classList.add('hidden');
            
            setTimeout(() => createMessage(`تم استلام طلبك في وضع ${currentMode || 'الدردشة العادية'}. كيف يمكنني مساعدتك أكثر؟`, 'ai'), 800);
        }

        function createMessage(content, sender, isHtml = false) {
            const container = document.createElement('div');
            container.className = "message-container";
            const msgDiv = document.createElement('div');
            msgDiv.className = sender === 'user' ? "message-user" : "message-ai";
            
            if (isHtml) {
                msgDiv.innerHTML = content;
            } else {
                msgDiv.innerHTML = `<p class="text-[16px] leading-relaxed">${content}</p>`;
            }
            
            if (sender === 'ai') {
                const actions = document.createElement('div');
                actions.className = "flex items-center gap-4 mt-2 opacity-50 hover:opacity-100 transition justify-end";
                actions.innerHTML = `
                    <button class="p-1 hover:text-blue-500"><i data-lucide="thumbs-up" class="w-4 h-4"></i></button>
                    <button class="p-1 hover:text-red-500"><i data-lucide="thumbs-down" class="w-4 h-4"></i></button>
                `;
                msgDiv.appendChild(actions);
            }

            container.appendChild(msgDiv);
            chatView.appendChild(container);
            lucide.createIcons();
            document.getElementById('mainContent').scrollTo({ top: document.getElementById('mainContent').scrollHeight, behavior: 'smooth' });
        }

        window.onclick = () => {
            optionsMenu.style.display = 'none';
        };
    </script>
</body>
</html>
